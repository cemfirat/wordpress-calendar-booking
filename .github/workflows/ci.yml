name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Check PHP syntax
        run: find . -name '*.php' -not -path './.git/*' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

  wordpress:
    name: WordPress ${{ matrix.wordpress }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - wordpress: '6.5'
            php: '8.0'
          - wordpress: latest
            php: '8.3'
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: wordpress
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pwordpress"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, dom, sodium, zip, mbstring
          tools: wp-cli:2.12.0, composer
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build local UIkit fallback
        run: |
          npm install --no-audit --no-fund
          npm run build:assets
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-dev
      - name: Install WordPress and plugin
        env:
          WP_VERSION: ${{ matrix.wordpress }}
        run: |
          set -euo pipefail
          WP_ROOT="$RUNNER_TEMP/wordpress"
          wp core download --path="$WP_ROOT" --version="$WP_VERSION"
          wp config create --path="$WP_ROOT" --dbname=wordpress --dbuser=root --dbpass=wordpress --dbhost=127.0.0.1:3306
          wp core install --path="$WP_ROOT" --url=http://127.0.0.1:8080 --title=WPCB --admin_user=admin --admin_password=integration-only --admin_email=test@example.com --skip-email
          mkdir -p "$WP_ROOT/wp-content/plugins/wordpress-calendar-booking"
          rsync -a --delete             --exclude='.git'             --exclude='.github'             --exclude='_bootstrap'             "$GITHUB_WORKSPACE/" "$WP_ROOT/wp-content/plugins/wordpress-calendar-booking/"
          wp plugin activate wordpress-calendar-booking --path="$WP_ROOT"
      - name: Run WordPress smoke test
        run: wp eval-file "$GITHUB_WORKSPACE/tests/wordpress-smoke.php" --path="$RUNNER_TEMP/wordpress"
      - name: Run booking export smoke test
        run: wp eval-file "$GITHUB_WORKSPACE/tests/booking-export-smoke.php" --path="$RUNNER_TEMP/wordpress"
      - name: Run booking audit history smoke test
        run: wp eval-file "$GITHUB_WORKSPACE/tests/booking-audit-smoke.php" --path="$RUNNER_TEMP/wordpress"
      - name: Run resource scheduling smoke test
        run: wp eval-file "$GITHUB_WORKSPACE/tests/resource-scheduling-smoke.php" --path="$RUNNER_TEMP/wordpress"
      - name: Run capacity/group booking smoke test
        run: wp eval-file "$GITHUB_WORKSPACE/tests/capacity-booking-smoke.php" --path="$RUNNER_TEMP/wordpress"
      - name: Run REST API and webhook smoke test
        run: wp eval-file "$GITHUB_WORKSPACE/tests/rest-webhook-smoke.php" --path="$RUNNER_TEMP/wordpress"
      - name: Run scheduler health smoke test
        run: wp eval-file "$GITHUB_WORKSPACE/tests/scheduler-health-smoke.php" --path="$RUNNER_TEMP/wordpress"
      - name: Run notification delivery smoke test
        run: wp eval-file "$GITHUB_WORKSPACE/tests/notification-delivery-smoke.php" --path="$RUNNER_TEMP/wordpress"
      - name: Run Gutenberg blocks smoke test
        run: wp eval-file "$GITHUB_WORKSPACE/tests/gutenberg-blocks-smoke.php" --path="$RUNNER_TEMP/wordpress"
      - name: Run Microsoft Graph provider smoke test
        run: wp eval-file "$GITHUB_WORKSPACE/tests/microsoft-provider-smoke.php" --path="$RUNNER_TEMP/wordpress"
      - name: Run CalDAV provider smoke test
        run: wp eval-file "$GITHUB_WORKSPACE/tests/caldav-provider-smoke.php" --path="$RUNNER_TEMP/wordpress"
      - name: Run provider diagnostics smoke test
        run: wp eval-file "$GITHUB_WORKSPACE/tests/provider-diagnostics-smoke.php" --path="$RUNNER_TEMP/wordpress"
      - name: Verify GET-safe and POST-only public booking actions
        if: matrix.wordpress == 'latest'
        run: python3 "$GITHUB_WORKSPACE/tests/public-action-flow.py"
      - name: Verify concurrent reservation serialization
        if: matrix.wordpress == 'latest'
        run: |
          set -euo pipefail
          fixture="$(wp eval-file "$GITHUB_WORKSPACE/tests/create-reservation-fixture.php" --path="$RUNNER_TEMP/wordpress")"
          export WPCB_TEST_TYPE_ID="${fixture%%|*}"
          export WPCB_TEST_SLOT_TOKEN="${fixture#*|}"
          echo "Fixture type: $WPCB_TEST_TYPE_ID"
          echo "Slot token length: ${#WPCB_TEST_SLOT_TOKEN}"
          printf '%s' "$WPCB_TEST_SLOT_TOKEN" | grep -Eq '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'

          token_check="$(wp eval-file "$GITHUB_WORKSPACE/tests/verify-slot-token.php" --path="$RUNNER_TEMP/wordpress")"
          echo "$token_check"
          test "$token_check" = "TOKEN_OK"

          WPCB_TEST_EMAIL=first@example.com wp eval-file "$GITHUB_WORKSPACE/tests/reserve-once.php" --path="$RUNNER_TEMP/wordpress" > "$RUNNER_TEMP/reserve-a.txt" &
          first_pid=$!
          WPCB_TEST_EMAIL=second@example.com wp eval-file "$GITHUB_WORKSPACE/tests/reserve-once.php" --path="$RUNNER_TEMP/wordpress" > "$RUNNER_TEMP/reserve-b.txt" &
          second_pid=$!
          wait "$first_pid"
          wait "$second_pid"

          cat "$RUNNER_TEMP/reserve-a.txt" "$RUNNER_TEMP/reserve-b.txt"
          reserved_count="$(awk '/^RESERVED /{n++} END{print n+0}' "$RUNNER_TEMP/reserve-a.txt" "$RUNNER_TEMP/reserve-b.txt")"
          rejected_count="$(awk '/^REJECTED /{n++} END{print n+0}' "$RUNNER_TEMP/reserve-a.txt" "$RUNNER_TEMP/reserve-b.txt")"
          test "$reserved_count" -eq 1
          test "$rejected_count" -eq 1

          booking_count="$(WPCB_TEST_STATE_ACTION=count wp eval-file "$GITHUB_WORKSPACE/tests/reservation-race-state.php" --path="$RUNNER_TEMP/wordpress")"
          test "$booking_count" -eq 1

          expire_result="$(WPCB_TEST_STATE_ACTION=expire wp eval-file "$GITHUB_WORKSPACE/tests/reservation-race-state.php" --path="$RUNNER_TEMP/wordpress")"
          test "$expire_result" = "EXPIRED"

          WPCB_TEST_EMAIL=after-expiry@example.com wp eval-file "$GITHUB_WORKSPACE/tests/reserve-once.php" --path="$RUNNER_TEMP/wordpress" > "$RUNNER_TEMP/reserve-after-expiry.txt"
          cat "$RUNNER_TEMP/reserve-after-expiry.txt"
          grep -q '^RESERVED ' "$RUNNER_TEMP/reserve-after-expiry.txt"

          booking_count="$(WPCB_TEST_STATE_ACTION=count wp eval-file "$GITHUB_WORKSPACE/tests/reservation-race-state.php" --path="$RUNNER_TEMP/wordpress")"
          test "$booking_count" -eq 2

      - name: Verify independent resources reserve concurrently
        if: matrix.wordpress == 'latest'
        run: |
          set -euo pipefail
          fixture="$(wp eval-file "$GITHUB_WORKSPACE/tests/create-resource-race-fixture.php" --path="$RUNNER_TEMP/wordpress")"
          export WPCB_TEST_TYPE_ID="${fixture%%|*}"
          rest="${fixture#*|}"
          token_a="${rest%%|*}"
          token_b="${rest#*|}"

          test -n "$token_a"
          test -n "$token_b"

          WPCB_TEST_SLOT_TOKEN="$token_a" WPCB_TEST_EMAIL=resource-a@example.com wp eval-file "$GITHUB_WORKSPACE/tests/reserve-once.php" --path="$RUNNER_TEMP/wordpress" > "$RUNNER_TEMP/resource-a.txt" &
          first_pid=$!
          WPCB_TEST_SLOT_TOKEN="$token_b" WPCB_TEST_EMAIL=resource-b@example.com wp eval-file "$GITHUB_WORKSPACE/tests/reserve-once.php" --path="$RUNNER_TEMP/wordpress" > "$RUNNER_TEMP/resource-b.txt" &
          second_pid=$!
          wait "$first_pid"
          wait "$second_pid"

          cat "$RUNNER_TEMP/resource-a.txt" "$RUNNER_TEMP/resource-b.txt"
          grep -q '^RESERVED ' "$RUNNER_TEMP/resource-a.txt"
          grep -q '^RESERVED ' "$RUNNER_TEMP/resource-b.txt"
      - name: Verify last-seat capacity race
        if: matrix.wordpress == 'latest'
        run: |
          set -euo pipefail
          fixture="$(wp eval-file "$GITHUB_WORKSPACE/tests/create-capacity-race-fixture.php" --path="$RUNNER_TEMP/wordpress")"
          export WPCB_TEST_TYPE_ID="${fixture%%|*}"
          export WPCB_TEST_SLOT_TOKEN="${fixture#*|}"

          WPCB_TEST_PARTY_SIZE=2 WPCB_TEST_EMAIL=capacity-a@example.com wp eval-file "$GITHUB_WORKSPACE/tests/reserve-once.php" --path="$RUNNER_TEMP/wordpress" > "$RUNNER_TEMP/capacity-a.txt" &
          first_pid=$!
          WPCB_TEST_PARTY_SIZE=2 WPCB_TEST_EMAIL=capacity-b@example.com wp eval-file "$GITHUB_WORKSPACE/tests/reserve-once.php" --path="$RUNNER_TEMP/wordpress" > "$RUNNER_TEMP/capacity-b.txt" &
          second_pid=$!
          wait "$first_pid"
          wait "$second_pid"

          cat "$RUNNER_TEMP/capacity-a.txt" "$RUNNER_TEMP/capacity-b.txt"
          reserved_count="$(awk '/^RESERVED /{n++} END{print n+0}' "$RUNNER_TEMP/capacity-a.txt" "$RUNNER_TEMP/capacity-b.txt")"
          rejected_count="$(awk '/^REJECTED /{n++} END{print n+0}' "$RUNNER_TEMP/capacity-a.txt" "$RUNNER_TEMP/capacity-b.txt")"
          test "$reserved_count" -eq 1
          test "$rejected_count" -eq 1


  package:
    name: Build release ZIP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build local UIkit fallback
        run: |
          npm install --no-audit --no-fund
          npm run build:assets
      - name: Install production Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-dev --optimize-autoloader
      - name: Build reproducible ZIP
        run: python3 scripts/package.py
      - name: Verify release contents
        run: |
          set -euo pipefail
          unzip -t dist/wordpress-calendar-booking.zip
          unzip -l dist/wordpress-calendar-booking.zip > "$RUNNER_TEMP/zip-list.txt"
          cat "$RUNNER_TEMP/zip-list.txt"
          ! grep -E '/(tests|node_modules|scripts|\.git|\.github)/' "$RUNNER_TEMP/zip-list.txt"
          ! grep -E '/(package(-lock)?\.json|composer\.json|composer\.lock)$' "$RUNNER_TEMP/zip-list.txt"
          grep -q 'wordpress-calendar-booking/vendor/autoload.php' "$RUNNER_TEMP/zip-list.txt"
          grep -q 'wordpress-calendar-booking/assets/vendor/uikit/uikit.min.css' "$RUNNER_TEMP/zip-list.txt"
          grep -q 'wordpress-calendar-booking/LICENSE' "$RUNNER_TEMP/zip-list.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: dist/wordpress-calendar-booking.zip
          if-no-files-found: error
          retention-days: 7

  browser_release:
    name: Browser release acceptance
    needs: [package]
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: wordpress
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pwordpress"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, dom, sodium, zip, mbstring
          tools: wp-cli:2.12.0
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: release-package
          path: dist
      - name: Install WordPress and packaged plugin
        run: |
          set -euo pipefail
          WP_ROOT="$RUNNER_TEMP/wordpress"
          wp core download --path="$WP_ROOT" --version=latest
          wp config create --path="$WP_ROOT" --dbname=wordpress --dbuser=root --dbpass=wordpress --dbhost=127.0.0.1:3306
          wp core install --path="$WP_ROOT" --url=http://127.0.0.1:8080 --title=WPCB-Browser --admin_user=admin --admin_password=integration-only --admin_email=test@example.com --skip-email
          wp plugin install "$GITHUB_WORKSPACE/dist/wordpress-calendar-booking.zip" --activate --path="$WP_ROOT"
          mkdir -p "$WP_ROOT/wp-content/mu-plugins"
          cp "$GITHUB_WORKSPACE/tests/browser-release-mu.php" "$WP_ROOT/wp-content/mu-plugins/wpcb-browser-release.php"
      - name: Install browser test runtime
        run: |
          npm install --no-save --ignore-scripts @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Run packaged release browser acceptance
        env:
          WP_ROOT: ${{ runner.temp }}/wordpress
          WPCB_E2E_BASE_URL: http://127.0.0.1:8080
          WPCB_E2E_ADMIN_USER: admin
          WPCB_E2E_ADMIN_PASSWORD: integration-only
        run: |
          set -euo pipefail
          wp server --host=127.0.0.1 --port=8080 --path="$WP_ROOT" > "$RUNNER_TEMP/wpcb-browser-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1

          npx playwright test tests/browser-release.spec.mjs --reporter=line
      - name: Upload redacted browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-release-failure
          path: tests/browser-artifacts
          if-no-files-found: ignore
          retention-days: 7

  fresh_release:
    name: Fresh install release ZIP
    needs: [package]
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: wordpress
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pwordpress"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, dom, sodium, zip, mbstring
          tools: wp-cli:2.12.0
          coverage: none
      - uses: actions/download-artifact@v4
        with:
          name: release-package
          path: dist
      - name: Install WordPress and release ZIP
        run: |
          set -euo pipefail
          WP_ROOT="$RUNNER_TEMP/wordpress"
          wp core download --path="$WP_ROOT" --version=latest
          wp config create --path="$WP_ROOT" --dbname=wordpress --dbuser=root --dbpass=wordpress --dbhost=127.0.0.1:3306
          wp core install --path="$WP_ROOT" --url=http://127.0.0.1:8080 --title=WPCBRelease --admin_user=admin --admin_password=integration-only --admin_email=test@example.com --skip-email
          wp plugin install "$GITHUB_WORKSPACE/dist/wordpress-calendar-booking.zip" --activate --path="$WP_ROOT"
          wp eval-file "$GITHUB_WORKSPACE/tests/release-fresh.php" --path="$WP_ROOT"

  legacy_upgrade:
    name: Imported 1.x migration
    needs: [package]
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: wordpress
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pwordpress"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, dom, sodium, zip, mbstring
          tools: wp-cli:2.12.0
          coverage: none
      - uses: actions/download-artifact@v4
        with:
          name: release-package
          path: dist
      - name: Create imported 1.x fixture
        run: |
          set -euo pipefail
          WP_ROOT="$RUNNER_TEMP/wordpress"
          wp core download --path="$WP_ROOT" --version=latest
          wp config create --path="$WP_ROOT" --dbname=wordpress --dbuser=root --dbpass=wordpress --dbhost=127.0.0.1:3306
          wp core install --path="$WP_ROOT" --url=http://127.0.0.1:8080 --title=WPCBLegacy --admin_user=admin --admin_password=integration-only --admin_email=test@example.com --skip-email
          wp eval-file "$GITHUB_WORKSPACE/tests/legacy-1x-fixture.php" --path="$WP_ROOT"
      - name: Install release ZIP and verify migrations
        run: |
          set -euo pipefail
          WP_ROOT="$RUNNER_TEMP/wordpress"
          wp plugin install "$GITHUB_WORKSPACE/dist/wordpress-calendar-booking.zip" --activate --path="$WP_ROOT"
          wp eval-file "$GITHUB_WORKSPACE/tests/legacy-upgrade-assert.php" --path="$WP_ROOT"

  release:
    name: Publish stable release
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [php, wordpress, fresh_release, legacy_upgrade, browser_release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: calendar-booking-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-package
          path: dist
      - name: Prepare release metadata
        id: metadata
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          text = pathlib.Path('wordpress-calendar-booking.php').read_text()
          def header(name):
              match = re.search(r'^ \* ' + re.escape(name) + r': ([0-9.]+)$', text, re.M)
              assert match, name
              return match.group(1)
          version = header('Version')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'tag=v{version}\n')
          changelog = pathlib.Path('CHANGELOG.md').read_text()
          section = changelog.split(f'## {version}\n', 1)[1].split('\n## ', 1)[0].strip()
          notes = f"Requires WordPress: {header('Requires at least')}\nRequires PHP: {header('Requires PHP')}\n\n{section}\n"
          pathlib.Path('dist/release-notes.md').write_text(notes)
          PY
      - name: Publish exact stable asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/release-draft" 2>/dev/null; then
            if [ "$(cat "$RUNNER_TEMP/release-draft")" = false ]; then
              echo "Release $RELEASE_TAG already published; keeping it immutable."
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "WordPress Calendar Booking $RELEASE_TAG" --notes-file dist/release-notes.md --draft
          fi
          gh release upload "$RELEASE_TAG" dist/wordpress-calendar-booking.zip --clobber
          gh release edit "$RELEASE_TAG" --notes-file dist/release-notes.md --draft=false --latest

  production_update:
    name: Public GitHub updater smoke test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [release]
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: wordpress
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pwordpress"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, dom, sodium, zip, mbstring
          tools: wp-cli:2.12.0
          coverage: none
      - uses: actions/download-artifact@v4
        with:
          name: release-package
          path: dist
      - name: Build synthetic pre-release installation
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/synthetic"
          unzip -q dist/wordpress-calendar-booking.zip -d "$RUNNER_TEMP/synthetic"
          python3 - <<'PY'
          import os, pathlib
          p = pathlib.Path(os.environ["RUNNER_TEMP"]) / "synthetic/wordpress-calendar-booking/wordpress-calendar-booking.php"
          text = p.read_text()
          text = text.replace(" * Version: 3.1.0", " * Version: 3.0.0")
          text = text.replace("define('WPCB_VERSION', '3.1.0');", "define('WPCB_VERSION', '3.0.0');")
          p.write_text(text)
          PY
          (cd "$RUNNER_TEMP/synthetic" && zip -qr "$RUNNER_TEMP/calendar-booking-3.0.0.zip" wordpress-calendar-booking)
      - name: Install synthetic old version
        run: |
          set -euo pipefail
          WP_ROOT="$RUNNER_TEMP/wordpress"
          wp core download --path="$WP_ROOT" --version=latest
          wp config create --path="$WP_ROOT" --dbname=wordpress --dbuser=root --dbpass=wordpress --dbhost=127.0.0.1:3306
          wp core install --path="$WP_ROOT" --url=http://127.0.0.1:8080 --title=WPCBUpdater --admin_user=admin --admin_password=integration-only --admin_email=test@example.com --skip-email
          wp plugin install "$RUNNER_TEMP/calendar-booking-3.0.0.zip" --activate --path="$WP_ROOT"
          test "$(wp plugin get wordpress-calendar-booking --field=version --path="$WP_ROOT")" = "3.1.0"
      - name: Discover real public v3.1.0 release
        run: |
          set -euo pipefail
          WP_ROOT="$RUNNER_TEMP/wordpress"
          found=0
          for attempt in 1 2 3 4 5 6; do
            version="$(wp eval '
              require_once ABSPATH . "wp-admin/includes/update.php";
              delete_site_transient(Wpcb\Updates\GitHubUpdater::CACHE_KEY);
              delete_site_transient("update_plugins");
              wp_update_plugins();
              $updates = get_site_transient("update_plugins");
              $basename = plugin_basename(WPCB_FILE);
              if (isset($updates->response[$basename])) {
                  echo $updates->response[$basename]->new_version;
              }
            ' --path="$WP_ROOT")"
            if [ "$version" = "3.1.0" ]; then
              found=1
              break
            fi
            sleep 5
          done
          test "$found" -eq 1
      - name: Update through WordPress from public GitHub
        run: |
          set -euo pipefail
          WP_ROOT="$RUNNER_TEMP/wordpress"
          wp plugin update wordpress-calendar-booking --path="$WP_ROOT"
          test "$(wp plugin get wordpress-calendar-booking --field=version --path="$WP_ROOT")" = "3.0.0"
          wp plugin is-active wordpress-calendar-booking --path="$WP_ROOT"
          echo "PASS: synthetic 3.0.0 updated through the public GitHub release to 3.1.0."
