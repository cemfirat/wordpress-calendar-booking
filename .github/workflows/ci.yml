    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, dom, sodium, zip, mbstring
          tools: wp-cli:2.12.0
          coverage: none
      - uses: actions/download-artifact@v4
        with:
          name: release-package
          path: dist
      - name: Install WordPress and packaged plugin
        run: |
          set -euo pipefail
          WP_ROOT="$RUNNER_TEMP/wordpress"
          wp core download --path="$WP_ROOT" --version=latest
          wp config create --path="$WP_ROOT" --dbname=wordpress --dbuser=root --dbpass=wordpress --dbhost=127.0.0.1:3306
          wp core install --path="$WP_ROOT" --url=http://127.0.0.1:8080 --title=WPCB-Uninstall --admin_user=admin --admin_password=integration-only --admin_email=test@example.com --skip-email
          wp plugin install "$GITHUB_WORKSPACE/dist/wordpress-calendar-booking.zip" --activate --path="$WP_ROOT"
      - name: Verify default uninstall preserves durable data
        run: |
          set -euo pipefail
          WP_ROOT="$RUNNER_TEMP/wordpress"
          wp eval '
            $s=(array)get_option("wpcb_settings",[]);
            $s["delete_data_on_uninstall"]=0;
            update_option("wpcb_settings",$s);
            set_transient("wpcb_uninstall_fixture","cache",HOUR_IN_SECONDS);
            wp_schedule_single_event(time()+3600,"wpcb_waitlist_send_offer",[999999]);
            global $wpdb;
            $now=gmdate("Y-m-d H:i:s");
            $wpdb->insert($wpdb->prefix."wpcb_booking_types",[
              "name"=>"Uninstall fixture","slug"=>"uninstall-fixture","description"=>"",
              "duration_minutes"=>30,"buffer_before_minutes"=>0,"buffer_after_minutes"=>0,
              "capacity"=>1,"show_remaining_capacity"=>0,"payment_mode"=>"free","price_minor"=>0,
              "currency"=>"EUR","is_active"=>1,"is_public"=>0,"sort_order"=>0,
              "created_at"=>$now,"updated_at"=>$now
            ]);
          ' --path="$WP_ROOT"
          wp plugin uninstall wordpress-calendar-booking --deactivate --path="$WP_ROOT"
          test "$(wp db query "SHOW TABLES LIKE 'wp_wpcb_booking_types'" --skip-column-names --path="$WP_ROOT")" = "wp_wpcb_booking_types"
          test "$(wp option get wpcb_settings --format=json --path="$WP_ROOT" >/dev/null 2>&1; echo $?)" -eq 0
          test "$(wp eval 'echo get_transient("wpcb_uninstall_fixture")===false ? "clean" : "left";' --path="$WP_ROOT")" = "clean"
          test "$(wp eval '$c=_get_cron_array(); $found=false; foreach((array)$c as $events){ if(isset($events["wpcb_waitlist_send_offer"])){$found=true;}} echo $found?"left":"clean";' --path="$WP_ROOT")" = "clean"
      - name: Verify explicit destructive uninstall removes plugin-owned data
        run: |
          set -euo pipefail
          WP_ROOT="$RUNNER_TEMP/wordpress"
          wp plugin install "$GITHUB_WORKSPACE/dist/wordpress-calendar-booking.zip" --activate --path="$WP_ROOT"
          wp eval '
            $s=(array)get_option("wpcb_settings",[]);
            $s["delete_data_on_uninstall"]=1;
            update_option("wpcb_settings",$s);
          ' --path="$WP_ROOT"
          wp plugin uninstall wordpress-calendar-booking --deactivate --path="$WP_ROOT"
          table_count="$(wp db query "SHOW TABLES LIKE 'wp_wpcb_%'" --skip-column-names --path="$WP_ROOT" | wc -l | tr -d ' ')"
          test "$table_count" -eq 0
          option_count="$(wp db query "SELECT COUNT(*) FROM wp_options WHERE option_name LIKE 'wpcb\\_%'" --skip-column-names --path="$WP_ROOT")"
          test "$option_count" -eq 0

  release:
    name: Publish stable release
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [docs, php, dependency_audit, i18n, wordpress, fresh_release, legacy_upgrade, browser_release, uninstall_release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    concurrency:
      group: calendar-booking-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-package
          path: dist
      - name: Prepare release metadata
        id: metadata
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          text = pathlib.Path('wordpress-calendar-booking.php').read_text()
          def header(name):
              match = re.search(r'^ \* ' + re.escape(name) + r': ([0-9.]+)$', text, re.M)
              assert match, name
              return match.group(1)
          version = header('Version')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'tag=v{version}\n')
          changelog = pathlib.Path('CHANGELOG.md').read_text()
          section = changelog.split(f'## {version}\n', 1)[1].split('\n## ', 1)[0].strip()
          notes = f"Requires WordPress: {header('Requires at least')}\nRequires PHP: {header('Requires PHP')}\n\n{section}\n"
          pathlib.Path('dist/release-notes.md').write_text(notes)
          PY
      - name: Verify packaged checksum
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c wordpress-calendar-booking.zip.sha256
      - name: Generate release build provenance
        uses: actions/attest@v4
        with:
          subject-path: dist/wordpress-calendar-booking.zip
      - name: Publish exact stable asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/release-draft" 2>/dev/null; then
            if [ "$(cat "$RUNNER_TEMP/release-draft")" = false ]; then
              echo "Release $RELEASE_TAG already published; keeping it immutable."
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "WordPress Calendar Booking $RELEASE_TAG" --notes-file dist/release-notes.md --draft
          fi
          gh release upload "$RELEASE_TAG" dist/wordpress-calendar-booking.zip dist/wordpress-calendar-booking.zip.sha256 --clobber
          gh release edit "$RELEASE_TAG" --notes-file dist/release-notes.md --draft=false --latest

  production_update:
    name: Public GitHub updater smoke test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: wordpress
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pwordpress"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, dom, sodium, zip, mbstring
          tools: wp-cli:2.12.0
          coverage: none
      - uses: actions/download-artifact@v4
        with:
          name: release-package
          path: dist
      - name: Verify current build checksum and provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c wordpress-calendar-booking.zip.sha256)
          gh attestation verify dist/wordpress-calendar-booking.zip -R "$GITHUB_REPOSITORY"
      - name: Resolve updater versions
        run: |
          set -euo pipefail
          TARGET_VERSION="$(python3 - <<'PY'
          import pathlib, re
          text = pathlib.Path("wordpress-calendar-booking.php").read_text()
          match = re.search(r"^ \* Version: ([0-9.]+)$", text, re.M)
          assert match, "plugin header version is missing"
          print(match.group(1))
          PY
          )"
          echo "TARGET_VERSION=$TARGET_VERSION" >> "$GITHUB_ENV"
          echo "SYNTHETIC_VERSION=0.0.0" >> "$GITHUB_ENV"
      - name: Verify published release checksum and provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/verify_public_release.py download "$TARGET_VERSION" "$RUNNER_TEMP/wpcb-public-release"
      - name: Build synthetic pre-release installation
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/synthetic"
          unzip -q dist/wordpress-calendar-booking.zip -d "$RUNNER_TEMP/synthetic"
          python3 - <<'PY'
          import os, pathlib, re
          p = pathlib.Path(os.environ["RUNNER_TEMP"]) / "synthetic/wordpress-calendar-booking/wordpress-calendar-booking.php"
          target = os.environ["TARGET_VERSION"]
          synthetic = os.environ["SYNTHETIC_VERSION"]
          text = p.read_text()
          text, count = re.subn(r"^ \* Version: " + re.escape(target) + r"$", " * Version: " + synthetic, text, count=1, flags=re.M)
          assert count == 1, "synthetic header version replacement failed"
          old_define = "define('WPCB_VERSION', '" + target + "');"
          new_define = "define('WPCB_VERSION', '" + synthetic + "');"
          assert old_define in text, "synthetic constant version replacement failed"
          p.write_text(text.replace(old_define, new_define, 1))
          PY
          (cd "$RUNNER_TEMP/synthetic" && zip -qr "$RUNNER_TEMP/calendar-booking-synthetic.zip" wordpress-calendar-booking)
      - name: Install synthetic old version
        run: |
          set -euo pipefail
          WP_ROOT="$RUNNER_TEMP/wordpress"
          wp core download --path="$WP_ROOT" --version=latest
          wp config create --path="$WP_ROOT" --dbname=wordpress --dbuser=root --dbpass=wordpress --dbhost=127.0.0.1:3306
          wp core install --path="$WP_ROOT" --url=http://127.0.0.1:8080 --title=WPCBUpdater --admin_user=admin --admin_password=integration-only --admin_email=test@example.com --skip-email
          wp plugin install "$RUNNER_TEMP/calendar-booking-synthetic.zip" --activate --path="$WP_ROOT"
          test "$(wp plugin get wordpress-calendar-booking --field=version --path="$WP_ROOT")" = "$SYNTHETIC_VERSION"
      - name: Discover real public release
        run: |
          set -euo pipefail
          WP_ROOT="$RUNNER_TEMP/wordpress"
          found=0
          for attempt in 1 2 3 4 5 6; do
            version="$(wp eval '
              require_once ABSPATH . "wp-admin/includes/update.php";
              delete_site_transient(Wpcb\Updates\GitHubUpdater::CACHE_KEY);
              delete_site_transient("update_plugins");
              wp_update_plugins();
              $updates = get_site_transient("update_plugins");
              $basename = plugin_basename(WPCB_FILE);
              if (isset($updates->response[$basename])) {
                  echo $updates->response[$basename]->new_version;
              }
            ' --path="$WP_ROOT")"
            if [ "$version" = "$TARGET_VERSION" ]; then
              found=1
              break
            fi
            sleep 5
          done
          test "$found" -eq 1
      - name: Update through WordPress from public GitHub
        run: |
          set -euo pipefail
          WP_ROOT="$RUNNER_TEMP/wordpress"
          wp plugin update wordpress-calendar-booking --path="$WP_ROOT"
          test "$(wp plugin get wordpress-calendar-booking --field=version --path="$WP_ROOT")" = "$TARGET_VERSION"
          wp plugin is-active wordpress-calendar-booking --path="$WP_ROOT"
          python3 scripts/verify_public_release.py installed "$TARGET_VERSION" "$RUNNER_TEMP/wpcb-public-release/wordpress-calendar-booking.zip" "$WP_ROOT/wp-content/plugins/wordpress-calendar-booking"
          echo "PASS: synthetic $SYNTHETIC_VERSION updated through the public GitHub release to $TARGET_VERSION."
