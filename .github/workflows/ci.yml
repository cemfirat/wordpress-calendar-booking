name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Check PHP syntax
        run: find . -name '*.php' -not -path './.git/*' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

  wordpress:
    name: WordPress ${{ matrix.wordpress }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - wordpress: '6.5'
            php: '8.0'
          - wordpress: latest
            php: '8.3'
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: wordpress
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pwordpress"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, dom, sodium, zip, mbstring
          tools: wp-cli:2.12.0, composer
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build local UIkit fallback
        run: |
          npm install --no-audit --no-fund
          npm run build:assets
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-dev
      - name: Install WordPress and plugin
        env:
          WP_VERSION: ${{ matrix.wordpress }}
        run: |
          set -euo pipefail
          WP_ROOT="$RUNNER_TEMP/wordpress"
          wp core download --path="$WP_ROOT" --version="$WP_VERSION"
          wp config create --path="$WP_ROOT" --dbname=wordpress --dbuser=root --dbpass=wordpress --dbhost=127.0.0.1:3306
          wp core install --path="$WP_ROOT" --url=http://127.0.0.1:8080 --title=CEMB --admin_user=admin --admin_password=integration-only --admin_email=test@example.com --skip-email
          mkdir -p "$WP_ROOT/wp-content/plugins/wordpress-calendar-booking"
          rsync -a --delete             --exclude='.git'             --exclude='.github'             --exclude='_bootstrap'             "$GITHUB_WORKSPACE/" "$WP_ROOT/wp-content/plugins/wordpress-calendar-booking/"
          wp plugin activate wordpress-calendar-booking --path="$WP_ROOT"
      - name: Run WordPress smoke test
        run: wp eval-file "$GITHUB_WORKSPACE/tests/wordpress-smoke.php" --path="$RUNNER_TEMP/wordpress"
      - name: Run Microsoft Graph provider smoke test
        run: wp eval-file "$GITHUB_WORKSPACE/tests/microsoft-provider-smoke.php" --path="$RUNNER_TEMP/wordpress"
      - name: Run CalDAV provider smoke test
        run: wp eval-file "$GITHUB_WORKSPACE/tests/caldav-provider-smoke.php" --path="$RUNNER_TEMP/wordpress"
      - name: Run provider diagnostics smoke test
        run: wp eval-file "$GITHUB_WORKSPACE/tests/provider-diagnostics-smoke.php" --path="$RUNNER_TEMP/wordpress"
      - name: Verify GET-safe and POST-only public booking actions
        if: matrix.wordpress == 'latest'
        run: python3 "$GITHUB_WORKSPACE/tests/public-action-flow.py"
      - name: Verify concurrent reservation serialization
        if: matrix.wordpress == 'latest'
        run: |
          set -euo pipefail
          fixture="$(wp eval-file "$GITHUB_WORKSPACE/tests/create-reservation-fixture.php" --path="$RUNNER_TEMP/wordpress")"
          export CEMB_TEST_TYPE_ID="${fixture%%|*}"
          export CEMB_TEST_SLOT_TOKEN="${fixture#*|}"
          echo "Fixture type: $CEMB_TEST_TYPE_ID"
          echo "Slot token length: ${#CEMB_TEST_SLOT_TOKEN}"
          printf '%s' "$CEMB_TEST_SLOT_TOKEN" | grep -Eq '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'

          token_check="$(wp eval-file "$GITHUB_WORKSPACE/tests/verify-slot-token.php" --path="$RUNNER_TEMP/wordpress")"
          echo "$token_check"
          test "$token_check" = "TOKEN_OK"

          CEMB_TEST_EMAIL=first@example.com wp eval-file "$GITHUB_WORKSPACE/tests/reserve-once.php" --path="$RUNNER_TEMP/wordpress" > "$RUNNER_TEMP/reserve-a.txt" &
          first_pid=$!
          CEMB_TEST_EMAIL=second@example.com wp eval-file "$GITHUB_WORKSPACE/tests/reserve-once.php" --path="$RUNNER_TEMP/wordpress" > "$RUNNER_TEMP/reserve-b.txt" &
          second_pid=$!
          wait "$first_pid"
          wait "$second_pid"

          cat "$RUNNER_TEMP/reserve-a.txt" "$RUNNER_TEMP/reserve-b.txt"
          reserved_count="$(awk '/^RESERVED /{n++} END{print n+0}' "$RUNNER_TEMP/reserve-a.txt" "$RUNNER_TEMP/reserve-b.txt")"
          rejected_count="$(awk '/^REJECTED /{n++} END{print n+0}' "$RUNNER_TEMP/reserve-a.txt" "$RUNNER_TEMP/reserve-b.txt")"
          test "$reserved_count" -eq 1
          test "$rejected_count" -eq 1

          booking_count="$(CEMB_TEST_STATE_ACTION=count wp eval-file "$GITHUB_WORKSPACE/tests/reservation-race-state.php" --path="$RUNNER_TEMP/wordpress")"
          test "$booking_count" -eq 1

          expire_result="$(CEMB_TEST_STATE_ACTION=expire wp eval-file "$GITHUB_WORKSPACE/tests/reservation-race-state.php" --path="$RUNNER_TEMP/wordpress")"
          test "$expire_result" = "EXPIRED"

          CEMB_TEST_EMAIL=after-expiry@example.com wp eval-file "$GITHUB_WORKSPACE/tests/reserve-once.php" --path="$RUNNER_TEMP/wordpress" > "$RUNNER_TEMP/reserve-after-expiry.txt"
          cat "$RUNNER_TEMP/reserve-after-expiry.txt"
          grep -q '^RESERVED ' "$RUNNER_TEMP/reserve-after-expiry.txt"

          booking_count="$(CEMB_TEST_STATE_ACTION=count wp eval-file "$GITHUB_WORKSPACE/tests/reservation-race-state.php" --path="$RUNNER_TEMP/wordpress")"
          test "$booking_count" -eq 2
