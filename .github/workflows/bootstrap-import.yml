name: Bootstrap remaining source

on:
  push:
    branches: [main]
    paths:
      - '_bootstrap/cemb-remaining.tar.gz'
      - '.github/workflows/bootstrap-import.yml'

permissions:
  contents: write

jobs:
  import:
    if: github.actor == 'cemfirat'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Expand remaining audited prototype files
        run: |
          set -euo pipefail
          tar -xzf _bootstrap/cemb-remaining.tar.gz
          rm -f _bootstrap/cemb-remaining.tar.gz
          rmdir _bootstrap 2>/dev/null || true
          rm -f .github/workflows/bootstrap-import.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete 1.x development baseline import"
          git push origin HEAD:main
