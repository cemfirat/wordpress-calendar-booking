name: Generate dependency lockfiles

on:
  push:
    branches:
      - hardening/140-lockfiles

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate committed dependency locks
        run: |
          set -euo pipefail
          composer update --no-install --no-interaction --no-progress
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          test -s composer.lock
          test -s package-lock.json
      - name: Commit generated locks
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Generate dependency lockfiles"
          git push
